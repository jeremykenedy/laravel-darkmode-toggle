name: Tests

on: ['push', 'pull_request']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction

      - name: Tests
        run: ./vendor/bin/pest --ci

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer install --prefer-dist --no-interaction

      - name: Pint
        run: ./vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer install --prefer-dist --no-interaction

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

  composer-health:
    runs-on: ubuntu-latest
    name: Composer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer update --prefer-dist --no-interaction
          composer audit

  frontend:
    runs-on: ubuntu-latest
    name: Frontend components

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install compilers outside the repository
        run: npm install --prefix /tmp/jscheck --no-fund --no-audit @vue/compiler-sfc@3 svelte@4 esbuild@0.25

      - name: Compile the Vue and Svelte components
        run: |
          cat > /tmp/jscheck/check.mjs <<'SCRIPT'
          import { readFileSync } from 'node:fs'
          import { parse, compileScript } from '@vue/compiler-sfc'
          import { compile } from 'svelte/compiler'

          const repo = process.argv[2]
          let failed = false

          try {
              const source = readFileSync(`${repo}/src/resources/js/vue/DarkmodeToggle.vue`, 'utf8')
              const { descriptor, errors } = parse(source, { filename: 'DarkmodeToggle.vue' })
              if (errors.length) throw errors[0]
              compileScript(descriptor, { id: 'darkmode' })
              console.log('vue: ok')
          } catch (error) {
              failed = true
              console.error('vue: FAILED', error.message)
          }

          try {
              const source = readFileSync(`${repo}/src/resources/js/svelte/DarkmodeToggle.svelte`, 'utf8')
              compile(source, { name: 'DarkmodeToggle' })
              console.log('svelte: ok')
          } catch (error) {
              failed = true
              console.error('svelte: FAILED', error.message)
          }

          process.exit(failed ? 1 : 0)
          SCRIPT
          node /tmp/jscheck/check.mjs "${GITHUB_WORKSPACE}"

      - name: Compile the React component
        run: /tmp/jscheck/node_modules/.bin/esbuild --loader:.jsx=jsx --outfile=/dev/null src/resources/js/react/DarkmodeToggle.jsx

      - name: Confirm the repository stays free of javascript tooling
        run: |
          test ! -f package.json || (echo "package.json must not be committed to this package" && exit 1)
          test ! -d node_modules || (echo "node_modules must not be committed to this package" && exit 1)
